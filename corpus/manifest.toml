id = "nixpkgs_hello"
pin = "nixpkgs"
path = "pkgs/by-name/he/hello/package.nix"
license = "MIT"
sha256 = "cb8af5ebf983639dc0714cb0ab7fca1888285b0fe3d69d063b7d4d3a10cb9c47"

