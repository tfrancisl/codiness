# Real code sliced out of pinned sources (see .tack/pins.toml); nothing here is
# copied into the repo. Build with:
#   nix-build -A packages.x86_64-linux.corpus -o corpus/snippets
#
# id       output file is <id>.<extension of path>
# pin      name of a tack pin
# path     file inside the pin
# lines    optional [first, last]; the whole file if absent
# dedent   optional number of leading spaces to strip from every line
# license  of the source file, for reference
# sha256   of the extracted text, so a moved pin or line range fails the build

